// Android Studio で開くための設定。
// 実際のビルドと検証は build-apk.sh (Gradle を使わない手動パイプライン) で行う。
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'jp.filexplorer.app'
    compileSdk 34

    defaultConfig {
        applicationId 'jp.filexplorer.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {}
